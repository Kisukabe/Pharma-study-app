name: CD Backend - Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/**'
      - 'Dockerfile.backend'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/deploy-backend-hf.yml'
  workflow_dispatch:

jobs:
  sync-to-huggingface:
    name: Sync Backend to Hugging Face Spaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }} # e.g. username/pharma-backend
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_REPO" ]; then
            echo "Skipping HF deploy: HF_TOKEN or HF_SPACE_REPO secret is not configured."
            exit 0
          fi
          
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub CI/CD"
          
          git remote add space https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO
          git push --force space main:main
