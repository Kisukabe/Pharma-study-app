services:
  - type: web
    name: pharma-study-backend
    # ============================================================
    # DOCKER IMAGE RUNTIME: Kéo pre-built image từ GitHub Container
    # Registry (GHCR) thay vì build từ source trên Render.
    # Lợi ích:
    #   - Deploy trong < 30 giây (không cần npm install / build)
    #   - Render Free không tốn RAM khi build (tránh OOM crash)
    #   - Rollback tức thì về bất kỳ SHA nào
    # ============================================================
    runtime: docker
    image:
      url: ghcr.io/kisukabe/pharma-backend:latest
      # Thêm credentials nếu GHCR package ở chế độ Private:
      # credentials:
      #   fromRegistryCredentialId: ghcr-credentials
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
